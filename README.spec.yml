intro: |
  <a id="video"></a>
  This repo collects quantized-inference kernels that run on all three GPU vendors, each checked against one CPU reference:
  the original **UltraQuant FP4 KV-cache verify kernel** (below), and **reproductions plus CUDA → HIP/SYCL ports of recent quantization papers**
  under [`ports/`](ports) ([HyperQuant](ports/hyperquant) and [PearlQuant](ports/pearlquant)). See [Ports](#ports).

  The core kernel implements one operation: **decode / speculative-verify attention over a 4-bit paged KV cache in the UltraQuant format**
  (FP4 e2m1 values, one UE8M0 power-of-two scale per 32 channels: {{ n.bytes_uq }} bytes per head per token for K or V at head_dim 128,
  **{{ n.vs_fp16 }} smaller than fp16, {{ n.vs_fp8 }} smaller than fp8**), where **all K speculative queries and the GQA group share a single pass over the KV pages**.
  The same op runs on **AMD (Triton, MI300X)**, **NVIDIA (native CUDA; A100, H100, L40S, B300, RTX PRO 6000)** and **Intel (SYCL / XMX, Arc B390)**,
  against one cache layout and one set of CPU reference vectors.

  > 📝 **Blog:** [One FP4 KV-cache verify kernel, three GPU vendors](blog/fused-fp4-kv-verify-three-vendors.md): how the ports were done and checked,
  > how UltraQuant relates to other KV-cache schemes, and whether it is the best one (it is not).

  **Prior art, stated plainly.** The UltraQuant format and a vLLM backend for it already exist upstream (vLLM PR #57057, `--kv-cache-dtype ultraquant_4bit`,
  merged 2026-10-06; AMD gfx950-oriented, FlyDSL D=256 decode plus a Triton fallback). In the vLLM source we read on 2026-11-12 it is listed for ROCm only,
  and its decode paths pass `max_query_len=1`, i.e. no K-query read sharing; we ran that backend at serving level on MI300X (below), but did not time it as a kernel
  against ours. K-query KV sharing in general is not new either, and on B300 a vendor NVFP4 kernel is faster than our port (see [Where we stand](#where-we-stand)).
  In the public sources we checked we found no public CUDA or SYCL port of the UltraQuant layout with fused K-query verify
  ([cuda/PRIOR_ART.md](cuda/PRIOR_ART.md), [sycl/PRIOR_ART.md](sycl/PRIOR_ART.md); the search was not exhaustive).

video:
  url: ""   # paste the GitHub user-attachments URL here after dragging the mp4 into a GitHub issue/PR; re-run `vrm.py readme README.spec.yml`
  caption: "Explainer video (with voice-over and subtitles): the problem, the idea, the numbers, and where UltraQuant does not win"
  mp4: video/ultraquant_explainer.mp4
  gif: video/preview.gif
  srt: video/ultraquant_explainer.srt
  poster: video/poster.png
  out_dir: video/.render
  fps: 24
  max_mb: 22
  render_crf: 18
  concurrency: 4
  poster_at: 150
  music: true
  voice: {engine: openai, voice: alloy, model: gpt-4o-mini-tts, tempo: 1.25}
  scenes:
    - type: title
      title: UltraQuant
      subtitle: One pass over a 4-bit KV cache, for speculative decoding
      chips: [AMD, NVIDIA, Intel, FP4 KV cache]
      say: "UltraQuant: one pass over a four bit KV cache, for speculative decoding, on AMD, NVIDIA and Intel GPUs. This is a short tour of what it does, what we measured, and where it does not win."
    - type: problem
      heading: The problem
      bullets:
        - "Speculative decoding verifies K draft tokens per step"
        - "A straightforward kernel reads the whole KV cache K times"
        - "Decode is memory bound, so extra traffic is extra time"
      say: "Speculative decoding verifies K draft tokens in one step. A straightforward kernel handles each of the K queries separately, so each one reads the entire KV cache again. Decode is memory bound, so that costs close to K times the time."
    - type: passes
      heading: "The idea: fuse the K queries into one pass"
      k_number: k_max
      left_title: "Plain: K separate passes"
      left_traffic: "KV reads"
      left_sub: "each query re-reads every page"
      right_title: "Fused: one shared pass"
      right_traffic: "KV reads"
      right_sub: "K queries + GQA group share each page"
      group_label: "K queries + GQA group"
      gif: assets/fused_passes.gif
      gif_start: 1.0
      gif_end: 21
      gif_speed: 1.5
      gif_width: 900
      say: "The idea is to fuse them. All K queries, and the query heads that share a key value head, are stacked into one tile. Each page of the cache is read once, and all K outputs come out together. On the left, K passes. On the right, one."
    - type: bits
      heading: "The format: FP4 E2M1 with a UE8M0 scale per 32"
      cells: 32
      row_label: "one 32-channel group of a K or V vector"
      cells_label: "32 values x 4 bits (FP4 E2M1)"
      scale_label: "1 byte scale"
      sizes:
        - {value: "{{ n.bytes_uq.text }} B", label: "UltraQuant per head per token", hl: true}
        - {value: "{{ n.bytes_fp8.text }} B", label: "fp8"}
        - {value: "{{ n.bytes_fp16.text }} B", label: "fp16"}
        - {value: "{{ n.vs_fp16.text }}", label: "smaller than fp16", hl: true}
      say: "The cache is stored in four bits. Each value is an FP4 E2M1 float, and every thirty two values share one eight bit power of two scale, called UE8M0. At head dimension one twenty eight that is {{ n.bytes_uq.numtext }} bytes per head per token, against {{ n.bytes_fp16.numtext }} for half precision and {{ n.bytes_fp8.numtext }} for fp8. That is {{ n.vs_fp16.numtext }} times smaller than half precision."
    - type: architecture
      diagram: flow
      heading: "Inside the kernel: one tile, one pass"
      say: "Inside the kernel, the queries form one tile. FP4 pages are expanded to bf16 in registers, each query gets its own causal mask, and split KV partial results are merged with a log sum exp reduction."
    - type: cards
      heading: "Three vendors, one op, one layout"
      cards:
        - {title: AMD, sub: "Triton · MI300X", lines: ["Triton kernel", "software FP4 decode"]}
        - {title: NVIDIA, sub: "CUDA · mma.sync, wgmma, tcgen05", lines: ["A100, H100, L40S, B300, RTX PRO 6000", "{{ n.cuda_launches }} vector-check launches, {{ n.cuda_fails }} failures"]}
        - {title: Intel, sub: "SYCL · ESIMD and XMX · Arc B390", lines: ["XMX joint_matrix and ESIMD paths", "{{ n.sycl_runs }} vector runs, {{ n.sycl_fails }} failures"]}
      footer: "Same cache layout, checked against the same CPU reference vectors; a pure permute of the upstream vLLM / SGLang layout"
      say: "The same operation runs on three vendors: a Triton kernel on AMD MI300X, native CUDA on five NVIDIA GPUs, and SYCL with XMX and ESIMD on an Intel Arc B390. All three read the same cache layout, a pure permute of the upstream one, and are checked against the same CPU reference vectors: {{ n.cuda_launches }} CUDA launches and {{ n.sycl_runs }} SYCL runs, with zero failures."
    - type: chart
      chart: speed_per_k
      gif: assets/speed_per_k.gif
      gif_start: 0.4
      gif_end: 10
      gif_width: 900
      gif_fps: 10
      say: "Time for one attention layer, batch eight, thirty two thousand tokens of context. Going from one speculative token to eight costs little. On MI300X it goes from {{ n.mi_k1.numtext }} to {{ n.mi_k8.numtext }} milliseconds. On H100, from {{ n.h100_k1.numtext }} to {{ n.h100_k8.numtext }}. On B300, from {{ n.b300_k1.numtext }} to {{ n.b300_k8.numtext }}."
    - type: chart
      chart: fused_vs_k
      say: "Against the same kernel with KV sharing off, the fused kernel at K equals eight is {{ n.gain_mi.numtext }} times faster on MI300X, {{ n.gain_h100.numtext }} times on H100, and {{ n.gain_b300.numtext }} times on B300. Across all six GPUs, the gain at K equals eight runs from {{ n.gain_min.numtext }} to {{ n.gain_max.numtext }} times. At K equals one there is nothing to fuse."
    - type: chart
      chart: ports_scatter
      gif: assets/ports_scatter.gif
      gif_start: 0.4
      gif_end: 12
      gif_width: 900
      gif_fps: 10
      say: "How does it compare with other schemes? We ported TurboQuant, NVFP4, FP8, KIVI, QServe, KVQuant, SpectralQuant, and the Planar, Iso and Rotor quantisers to the same MI300X harness. Speed is horizontal, perplexity increase on Qwen three eight B is vertical, so lower left is better. UltraQuant beats TurboQuant, SpectralQuant and the three bit rotation methods on both. But it is not the most accurate."
    - type: results
      heading: "Accuracy: UltraQuant is not the leader"
      items:
        - {label: "UltraQuant: perplexity increase, Qwen3-8B", number: ppl_uq}
        - {label: "NVFP4 (+4 B per vector)", number: ppl_nvfp4}
        - {label: "FP8 (2x the bytes)", number: ppl_fp8}
        - {label: "KIVI-4 (80 B)", number: ppl_kivi}
        - {label: "QServe-int4 (same 68 B)", number: ppl_qserve}
        - {label: "MXFP4 (same 68 B)", number: ppl_mxfp4}
      say: "On accuracy, UltraQuant is not the leader. QServe int four at the same sixty eight bytes, NVFP4, FP8 and KIVI four all beat it. NVFP4, for four more bytes, cuts the Qwen three perplexity increase from {{ n.ppl_uq.numtext }} to {{ n.ppl_nvfp4.numtext }}. FP8 is also faster at K equals one."
    - type: chart
      chart: b300_vs_fi
      say: "On B300, a vendor kernel is faster. FlashInfer's NVFP4 decode, which also shares the read across queries, takes {{ n.fi_k1.numtext }} milliseconds at K equals one, against {{ n.ours_k1.numtext }} for ours. That is {{ n.fi_ratio_2.numtext }} to {{ n.fi_ratio_8.numtext }} times faster across K. We do not beat vendor tuned kernels there."
    - type: chart
      chart: kv_capacity
      say: "In a real server? We ran vLLM's own native four bit backend, not our kernel, with Qwen three eight B on MI300X. KV capacity rises from {{ n.cap_bf16.numtext }} million tokens to {{ n.cap_fp4.numtext }} million, which is {{ n.cap_ratio.numtext }} times, because vLLM keeps four layers at full precision."
    - type: table
      table: serving_tbl
      heading: "Serving: what it costs"
      gif: assets/serving_costs.gif
      gif_start: 0.4
      gif_end: 9
      gif_width: 900
      gif_fps: 8
      say: "The costs are real. Question answering F one drops from {{ n.f1_bf16.numtext }} to {{ n.f1_fp4.numtext }}. Greedy output diverges from bf sixteen after a median of {{ n.drift_fp4.numtext }} tokens, earlier than fp8 at {{ n.drift_fp8.numtext }}. Plain decode is slower: {{ n.plain_fp4.numtext }} tokens per second against {{ n.plain_bf16.numtext }}. In an oversubscribed agent test FP4 wins, {{ n.agent_fp4.numtext }} against {{ n.agent_bf16.numtext }} tokens per second."
    - type: caveats
      heading: "Honest caveats"
      bullets:
        - "Kernel numbers are mostly synthetic microbenchmarks"
        - "Serving used vLLM's native backend, not our kernel; single runs on a shared GPU"
        - "MI300X and Arc decode FP4 in software, far below peak bandwidth"
        - "On B300, vendor NVFP4 kernels are faster"
      say: "Honest caveats. Most kernel numbers are synthetic microbenchmarks. The serving results come from vLLM's native backend, not our kernel, as single runs on a shared GPU. MI300X and Arc have no native FP4 matrix instructions, so FP4 is decoded in software. And on B300, vendor NVFP4 kernels are faster."
    - type: idea
      heading: "Is it the best? No. Here is where it wins."
      bullets:
        - "One validated op on AMD, NVIDIA and Intel"
        - "K queries share one pass: {{ n.gain_min.text }} to {{ n.gain_max.text }} faster than the same kernel with KV sharing off"
        - "{{ n.vs_fp16.text }} more KV tokens per GB than fp16"
        - "Exact UltraQuant layout, byte-compatible with upstream"
      say: "So, is it the best? No. Here is where it wins. One validated implementation across AMD, NVIDIA and Intel. A fused K query pass that is {{ n.gain_min.numtext }} to {{ n.gain_max.numtext }} times faster than the same kernel with KV sharing off. And {{ n.vs_fp16.numtext }} times more KV tokens per gigabyte. In the public sources we checked, we found no public CUDA or SYCL port of this layout with fused K query verify."
    - type: end
      title: UltraQuant
      subtitle: "Code, results and the blog post are in the repo"
      say: "The code, the results, and the blog post are all in the repo."

tables:
  - id: speed_tbl
    title: "Time per layer call (ms) and gain of the fused kernel over the same kernel with KV sharing off (one launch, KV read K times)"
    file: results/derived/readme_data.json
    rows_path: speed_table
    columns:
      - {key: gpu, title: GPU / backend}
      - {key: ms1, title: K=1, align: right, fmt: "{:.3f}"}
      - {key: ms2, title: K=2, align: right, fmt: "{:.3f}"}
      - {key: ms4, title: K=4, align: right, fmt: "{:.3f}"}
      - {key: ms8, title: K=8, align: right, fmt: "{:.3f}"}
      - {key: x2, title: "vs no sharing, K=2", align: right, fmt: "{:.1f}", unit: "x"}
      - {key: x4, title: "K=4", align: right, fmt: "{:.1f}", unit: "x"}
      - {key: x8, title: "K=8", align: right, fmt: "{:.1f}", unit: "x"}
  - id: vs_fi_tbl
    title: "B300: our CUDA port against FlashInfer trtllm-gen NVFP4 (same shape)"
    file: results/derived/readme_data.json
    rows_path: b300_vs_flashinfer
    columns:
      - {key: K, title: K}
      - {key: ours_ms, title: UltraQuant CUDA (ms), align: right, fmt: "{:.3f}"}
      - {key: flashinfer_nvfp4_ms, title: FlashInfer NVFP4 (ms), align: right, fmt: "{:.3f}"}
      - {key: ratio, title: FlashInfer is faster by, align: right, fmt: "{:.1f}", unit: "x"}
  - id: ports_tbl
    title: "Ported methods on MI300X (B8, ctx 32k, cold cache), sorted by K=1 time"
    file: results/derived/readme_data.json
    rows_path: ports
    highlight: UltraQuant
    columns:
      - {key: method, title: Method}
      - {key: bytes, title: B/vec, align: right, fmt: "{:g}"}
