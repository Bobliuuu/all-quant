# Spec for ~/video-readme-maker:  python3 ~/video-readme-maker/vrm.py all README.spec.yml
# Every number in the README and the video narration is read from results/*.json (some through results/derived/readme_data.json,
# produced by tools/readme_data.py from the same results files). Nothing here is hand-typed except labels and configuration.
project:
  name: AllQuant
  emoji: "⚡"
  tagline: "Quantized-inference kernels on AMD, NVIDIA and Intel GPUs: a fused FP4 KV-cache verify kernel, plus reproductions and three-vendor ports of HyperQuant and PearlQuant"
  repo: Bobliuuu/all-quant
hero:
  title: AllQuant
  subtitle: "quantization kernels, reproduced and ported across three GPU vendors"
  chips: [AMD HIP + Triton, NVIDIA CUDA, Intel SYCL, FP4 KV verify, HyperQuant, PearlQuant]
theme: {accent: "#27c8e8", accent2: "#ff6b6b", accent3: "#f2c14e", good: "#3ddc97"}
readme_out: README.md
assets_dir: assets
badges:
  - {label: AMD, message: "Triton · MI300X", color: ed1c24, logo: amd}
  - {label: NVIDIA, message: "CUDA · A100 to B300", color: 76b900, logo: nvidia}
  - {label: Intel, message: "SYCL · Arc B390", color: 0071c5, logo: intel}
  - {label: KV cache, message: "FP4 E2M1 + UE8M0/32", color: 27c8e8}
  - {label: fused vs no KV sharing, message: "up to {{ n.gain_max.text }}", color: 3ddc97}
  - {label: license, message: MIT, color: f2c14e, link: LICENSE}
  - {label: python, message: "3.9+", color: 3776ab, logo: python}
nav:
  - {emoji: "🎬", label: Video, anchor: video}
  - {emoji: "📊", label: Results, anchor: results}
  - {emoji: "🔁", label: Ports, anchor: ports}
  - {emoji: "🧩", label: How it works, anchor: how-it-works}
  - {emoji: "🖥️", label: Three vendors, anchor: three-vendors}
  - {emoji: "⚖️", label: Where we stand, anchor: where-we-stand}
  - {emoji: "🧠", label: Serving, anchor: serving}
  - {emoji: "🚀", label: Install, anchor: install}
  - {emoji: "🔁", label: Reproduce, anchor: reproduce}
  - {emoji: "⚠️", label: Limitations, anchor: caveats}
  - {emoji: "🗺️", label: Repo map, anchor: repo-map}

