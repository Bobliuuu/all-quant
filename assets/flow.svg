<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1550 408" width="1550" height="408" role="img" aria-label="Fused K-query verify: K queries and the GQA group share one pass over the FP4 pages">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a98ad"/></marker></defs>
<rect width="1550" height="408" rx="16" fill="#0b0f17"/>
<text x="40" y="42" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="22" fill="#e6edf6">Fused K-query verify: K queries and the GQA group share one pass over the FP4 pages</text>
<polyline points="310,132 375,132 375,132 440,132" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="710,132 775,132 775,132 840,132" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="710,316 775,316 775,132 840,132" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<text x="775" y="216" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">read once</text>
<polyline points="1110,132 1175,132 1175,132 1240,132" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="1375,184 1375,264" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<polyline points="1240,316 1175,316 1175,316 1110,316" fill="none" stroke="#8a98ad" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="40" y="80" width="270" height="104" rx="12" fill="#131a26" stroke="#3ddc97" stroke-width="2"/>
<text x="175.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">K queries + GQA group</text>
<text x="175.0" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">q0..qK-1, all heads that share a</text>
<text x="175.0" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">KV head</text>
<rect x="440" y="80" width="270" height="104" rx="12" fill="#131a26" stroke="#ff6b6b" stroke-width="2"/>
<text x="575.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">One tile, M = K x group</text>
<text x="575.0" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">stacked into one matrix multiply</text>
<rect x="440" y="264" width="270" height="104" rx="12" fill="#131a26" stroke="#f2c14e" stroke-width="2"/>
<text x="575.0" y="302" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">FP4 KV pages (68 B / vector)</text>
<text x="575.0" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">paged cache, each page read once</text>
<rect x="840" y="80" width="270" height="104" rx="12" fill="#131a26" stroke="#27c8e8" stroke-width="2"/>
<text x="975.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">FP4 to bf16 in registers</text>
<text x="975.0" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">UE8M0 scale per 32 channels</text>
<rect x="1240" y="80" width="270" height="104" rx="12" fill="#131a26" stroke="#27c8e8" stroke-width="2"/>
<text x="1375.0" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">Per-query causal mask</text>
<text x="1375.0" y="142" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">query j sees seq_len - K + j + 1</text>
<text x="1375.0" y="160" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">positions</text>
<rect x="1240" y="264" width="270" height="104" rx="12" fill="#131a26" stroke="#27c8e8" stroke-width="2"/>
<text x="1375.0" y="302" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">Split-KV + LSE reduce</text>
<text x="1375.0" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">partial results merged</text>
<rect x="840" y="264" width="270" height="104" rx="12" fill="#131a26" stroke="#3ddc97" stroke-width="2"/>
<text x="975.0" y="302" text-anchor="middle" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-weight="700" font-size="19" fill="#e6edf6">K outputs</text>
<text x="975.0" y="326" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#8a98ad">o0..oK-1 in one launch</text>
</svg>